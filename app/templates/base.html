<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}GuaipeCare{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='retro1') }}">
</head>
<body>
    <header class="topo-site">
        <div class="container-topo">
            <span class="icone-marca">🐾</span>
            <div class="texto-marca">
                <span class="nome-marca">GuaipeCare</span>
                <span class="subtitulo-marca">Coleira Inteligente Comunitária</span>
            </div>
        </div>
    </header>

    <main class="container">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape-site">
        <p>🐾 Cuidando com carinho dos nossos amigos de quatro patas 🐾</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
